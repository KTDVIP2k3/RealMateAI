name: Deploy RealMateAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
        run: |
          cat > .env << EOF
          SPRING_PROFILE=prod
          DB_URL=jdbc:postgresql://postgres:5432/RealmateAi
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          MAIL_USERNAME=$MAIL_USERNAME
          MAIL_PASSWORD=$MAIL_PASSWORD
          GEMINI_API_KEY=$GEMINI_API_KEY
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          PAYOS_CLIENT_ID=$PAYOS_CLIENT_ID
          PAYOS_API_KEY=$PAYOS_API_KEY
          PAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY
          PAYOS_RETURN_URL=$PAYOS_RETURN_URL
          PAYOS_CANCEL_URL=$PAYOS_CANCEL_URL
          EOF

      # 1. CHỈ hạ container xuống, KHÔNG dùng cờ -v (Bảo vệ Volume của DB)
      - name: Stop old containers
        run: docker compose down

      # 2. Dọn dẹp thông minh: Xóa image cũ, xóa cache build nhưng GIỮ LẠI VOLUME dữ liệu
      - name: Clean up Docker disk space (Safe Mode)
        run: |
          echo "==== DỌN DẸP HỆ THỐNG DOCKER (KHÔNG XÓA DATABASE) ===="
          docker system prune -a -f
          docker builder prune -f

      # 3. Tiến hành build và chạy container mới
      - name: Start containers
        run: docker compose up -d --build