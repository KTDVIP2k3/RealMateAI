name: Deploy RealMateAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop old containers
        run: docker compose down

      - name: Build images
        run: docker compose build --no-cache

      - name: Start containers
        run: docker compose up -d
