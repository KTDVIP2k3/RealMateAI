name: Deploy RealMateAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Bước 1: Dọn dẹp rác build cũ một cách AN TOÀN
      - name: Pre-clean Docker space
        run: |
          echo "==== DỌN SẠCH LAYER RÁC AN TOÀN TRƯỚC KHI DEPLOY ===="
          docker image prune -a -f
          docker builder prune -f

      # Bước 2: Tải code từ GitHub về
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 3: Tạo môi trường cấu hình .env
      - name: Create .env
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
        run: |
          cat > .env << EOF
          SPRING_PROFILE=prod
          DB_URL=jdbc:postgresql://postgres:5432/RealmateAi
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          MAIL_USERNAME=$MAIL_USERNAME
          MAIL_PASSWORD=$MAIL_PASSWORD
          GEMINI_API_KEY=$GEMINI_API_KEY
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          PAYOS_CLIENT_ID=$PAYOS_CLIENT_ID
          PAYOS_API_KEY=$PAYOS_API_KEY
          PAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY
          PAYOS_RETURN_URL=$PAYOS_RETURN_URL
          PAYOS_CANCEL_URL=$PAYOS_CANCEL_URL
          EOF

      # Bước 4: Build image mới trước (Vẫn giữ container cũ chạy bình thường không bị sập)
      - name: Build new image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          echo "==== ĐANG BUILD IMAGE MỚI (CÓ DÙNG CACHE ĐỂ TIẾT KIỆM Ổ CỨNG) ===="
          docker compose build

      # Bước 5: Chuyển đổi sang phiên bản mới an toàn (Rollback tự động nếu lỗi)
      - name: Deploy with Rollback protection
        run: |
          echo "==== ĐANG TRIỂN KHAI PHIÊN BẢN MỚI ===="
          
          # Lưu lại tên container cũ đang chạy (nếu có) để phòng hờ khôi phục
          OLD_CONTAINERS=$(docker compose ps -q)

          # Thử tắt container cũ và bật container mới lên
          if docker compose up -d --remove-orphans; then
            echo "==== DEPLOY THÀNH CÔNG ===="
          else
            echo "==== CẢNH BÁO: DEPLOY THẤT BẠI, ĐANG TIẾN HÀNH KHÔI PHỤC (ROLLBACK) ===="
            # Nếu khởi động bản mới lỗi, cố gắng khởi động lại bản cũ
            if [ ! -z "$OLD_CONTAINERS" ]; then
              docker compose start || docker compose up -d
            fi
            exit 1
          fi

      # Bước 6: Dọn sạch các layer rác cũ sau khi deploy thành công để trả lại dung lượng
      - name: Post-clean Docker space
        run: |
          echo "==== GIẢI PHÓNG BỘ NHỚ SAU KHI DEPLOY THÀNH CÔNG ===="
          docker image prune -f
          docker builder prune -f