name: Deploy RealMateAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Bước 1: Dọn dẹp rác build cũ một cách AN TOÀN (Không động vào Plesk hay các dịch vụ khác)
      - name: Pre-clean Docker space
        run: |
          echo "==== DỌN SẠCH LAYER RÁC AN TOÀN TRƯỚC KHI DEPLOY ===="
          docker image prune -f
          docker builder prune -f

      # Bước 2: Tải code từ GitHub về
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 3: Tạo môi trường cấu hình .env
      - name: Create .env
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
        run: |
          cat > .env << EOF
          SPRING_PROFILE=prod
          DB_URL=jdbc:postgresql://postgres:5432/RealmateAi
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          MAIL_USERNAME=$MAIL_USERNAME
          MAIL_PASSWORD=$MAIL_PASSWORD
          GEMINI_API_KEY=$GEMINI_API_KEY
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          PAYOS_CLIENT_ID=$PAYOS_CLIENT_ID
          PAYOS_API_KEY=$PAYOS_API_KEY
          PAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY
          PAYOS_RETURN_URL=$PAYOS_RETURN_URL
          PAYOS_CANCEL_URL=$PAYOS_CANCEL_URL
          EOF

      # Bước 4: Tắt container cũ (Không kèm cờ -v để bảo vệ an toàn cho dữ liệu Database)
      - name: Stop old containers
        run: docker compose down

      # Bước 5: Chỉ dọn dẹp các Image rác dôi ra sau khi down, KHÔNG xóa lung tung hệ thống
      - name: Mid-clean Docker space
        run: |
          echo "==== DỌN DẸP AN TOÀN TRƯỚC KHI BUILD MỚI ===="
          docker image prune -f
          docker builder prune -f

      # Bước 6: Build ứng dụng (Bật BuildKit để nén layer khôn ngoan hơn)
      - name: Start containers
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose up -d --build

      # Bước 7: Dọn sạch các layer cũ vừa bị thay thế để trả lại dung lượng trống ngay lập tức
      - name: Post-clean Docker space
        run: |
          echo "==== GIẢI PHÓNG BỘ NHỚ SAU KHI DEPLOY THÀNH CÔNG ===="
          docker image prune -f
          docker builder prune -f