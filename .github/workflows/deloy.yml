name: Deploy RealMateAI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Bước 1: Dọn dẹp khẩn cấp TRƯỚC khi làm bất cứ việc gì để lấy lại tối đa dung lượng trống
      - name: Pre-clean Docker space
        run: |
          echo "==== DỌN SẠCH LAYER RÁC TRƯỚC KHI DEPLOY ===="
          docker system prune -a -f
          docker builder prune -a -f

      # Bước 2: Tải code về
      - name: Checkout
        uses: actions/checkout@v4

      # Bước 3: Tạo môi trường cấu hình
      - name: Create .env
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS_RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS_CANCEL_URL }}
        run: |
          cat > .env << EOF
          SPRING_PROFILE=prod
          DB_URL=jdbc:postgresql://postgres:5432/RealmateAi
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          MAIL_USERNAME=$MAIL_USERNAME
          MAIL_PASSWORD=$MAIL_PASSWORD
          GEMINI_API_KEY=$GEMINI_API_KEY
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_API_KEY=$CLOUDINARY_API_KEY
          CLOUDINARY_API_SECRET=$CLOUDINARY_API_SECRET
          PAYOS_CLIENT_ID=$PAYOS_CLIENT_ID
          PAYOS_API_KEY=$PAYOS_API_KEY
          PAYOS_CHECKSUM_KEY=$PAYOS_CHECKSUM_KEY
          PAYOS_RETURN_URL=$PAYOS_RETURN_URL
          PAYOS_CANCEL_URL=$PAYOS_CANCEL_URL
          EOF

      # Bước 4: Tắt container cũ (TUYỆT ĐỐI KHÔNG dùng cờ -v để giữ DB)
      - name: Stop old containers
        run: docker compose down

      # Bước 5: Tiếp tục dọn dẹp các Image cũ vừa được giải phóng từ lệnh 'down'
      # để dọn đường trống tối đa cho lệnh build kế tiếp
      - name: Mid-clean Docker space
        run: |
          echo "==== DỌN DẸP IMAGE CŨ TRƯỚC KHI BUILD MỚI ===="
          docker system prune -a -f
          docker builder prune -a -f

      # Bước 6: Build ứng dụng (Bật BuildKit để nén layer khôn ngoan hơn)
      - name: Start containers
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose up -d --build