version: '3.8'

services:
  postgres:
    container_name: postgres_container
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: RealmateAi
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d RealmateAi"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  realmateai:
    container_name: realmateai_container
    build:
      context: .
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/RealmateAi
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy


  recommender-train:
    container_name: recommender_train_container
    build:
      context: ./ai-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: RealmateAi
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MODEL_DIR: /app/models
      TOP_N: 10
    volumes:
      - ai_models:/app/models
    command: ["python", "-m", "recommender.train"]
    profiles: ["ai-train"]
    depends_on:
      postgres:
        condition: service_healthy

  recommender-generate:
    container_name: recommender_generate_container
    build:
      context: ./ai-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: RealmateAi
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MODEL_DIR: /app/models
      TOP_N: 10
    volumes:
      - ai_models:/app/models
    command: ["python", "-m", "recommender.generate_recommendations"]
    profiles: ["ai-generate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ai_models: