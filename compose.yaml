services:
  postgres:
    container_name: postgres_container
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: RealmateAi

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - pgdata:/var/lib/postgresql/data

  realmateai:
    container_name: realmateai_container
    env_file:
      - .env
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/RealmateAi
    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: